<!-- Formulario para definir nova senha via link do email (itens 2.3, 2.4, 2.5) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Nivela</title>
</head>
<body>
    {% if validlink %}
        <h1>Definir nova senha</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar nova senha</button>
        </form>
    {% else %}
        <!-- Cai aqui quando o token expirou ou ja foi usado (itens 2.4 e 2.5) -->
        <h1>Link invalido</h1>
        <p>
            O link de recuperacao de senha e invalido ou ja expirou.
            Solicite uma nova recuperacao de senha.
        </p>
        <p>
            <a href="{% url 'password_reset' %}">Solicitar novo link</a>
        </p>
    {% endif %}
</body>
</html>
