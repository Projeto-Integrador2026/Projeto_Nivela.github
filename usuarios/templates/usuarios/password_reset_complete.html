<!-- Pagina exibida apos a senha ser redefinida com sucesso (item 2.1) -->
{% extends 'base.html' %}

{% block title %}Senha Redefinida - Nivela{% endblock %}

{% block extra_head %}
<style>
    .nivela-form-card{
        background: #F7F8FA;
        border: 1px solid #E4E7EC;
        border-radius: 12px;
        padding: 28px;
        max-width: 480px;
        margin: 32px auto;
        text-align: center;
    }
    .nivela-form-card h1{
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #1B1F27;
    }
    .nivela-form-card p{
        color: #4B5563;
        font-size: 14px;
        line-height: 1.5;
    }
    .nivela-form-card a{
        display: inline-block;
        margin-top: 12px;
        color: #1D63E8;
        font-weight: 600;
        text-decoration: none;
    }
    .nivela-form-card a:hover{
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="nivela-form-card">
    <h1>Senha redefinida com sucesso!</h1>
    <p>Sua senha foi alterada. Já pode fazer login com a nova senha.</p>
    <p>
        <a href="{% url 'two_factor:login' %}">Ir para o login</a>
    </p>
</div>
{% endblock %}
