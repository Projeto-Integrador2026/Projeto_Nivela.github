<!-- Formulario de solicitacao de recuperacao de senha (item 2.1) -->
{% extends 'base.html' %}

{% block title %}Recuperar Senha - Nivela{% endblock %}

{% block extra_head %}
<style>
    .nivela-form-card{
        background: #F7F8FA;
        border: 1px solid #E4E7EC;
        border-radius: 12px;
        padding: 28px;
        max-width: 480px;
        margin: 32px auto;
    }
    .nivela-form-card h1{
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        color: #1B1F27;
    }
    .nivela-form-card > p{
        color: #6B7280;
        font-size: 14px;
        margin-bottom: 22px;
    }
    .nivela-form-card form p{
        margin-bottom: 16px;
    }
    .nivela-form-card form label{
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #1B1F27;
        margin-bottom: 6px;
    }
    .nivela-form-card form input{
        width: 100%;
        padding: 11px 13px;
        border-radius: 8px;
        border: 1px solid #E4E7EC;
        font-size: 14px;
    }
    .nivela-form-card form input:focus{
        outline: none;
        border-color: #1D63E8;
    }
    .nivela-form-card button{
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #1D63E8;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 4px;
    }
    .nivela-form-card button:hover{
        background-color: #164FBD;
    }
</style>
{% endblock %}

{% block content %}
<div class="nivela-form-card">
    <h1>Recuperar senha</h1>
    <p>Digite seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar link de recuperação</button>
    </form>
</div>
{% endblock %}
