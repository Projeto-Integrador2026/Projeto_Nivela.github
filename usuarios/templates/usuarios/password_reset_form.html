<!-- Formulario de solicitacao de recuperacao de senha (item 2.1) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - Nivela</title>
</head>
<body>
    <h1>Recuperar senha</h1>
    <p>Digite seu e-mail cadastrado e enviaremos um link para redefinir sua senha.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar link de recuperacao</button>
    </form>
</body>
</html>
