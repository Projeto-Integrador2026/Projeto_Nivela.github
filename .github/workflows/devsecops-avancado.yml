name: DevSecOps Avançado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # PARTE 1: DAST com OWASP ZAP
  # ==========================================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar segredos efêmeros (só existem nesta execução)
        id: generate-secrets
        run: |
          SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')
          ENCRYPTION_KEY=$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV
          echo "FIELD_ENCRYPTION_KEY=${ENCRYPTION_KEY}" >> $GITHUB_ENV

      - name: Compilar a imagem Docker da aplicação
        run: |
          docker build -t nivela-app:test .

      - name: Subir a aplicação (modo produção, DEBUG=False)
        run: |
          docker run -d \
            --name nivela-web \
            -p 8000:8000 \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=False \
            -e AXES_ENABLED=False \
            -e SECRET_KEY="${{ env.SECRET_KEY }}" \
            -e FIELD_ENCRYPTION_KEY="${{ env.FIELD_ENCRYPTION_KEY }}" \
            -e DB_ENGINE=django.db.backends.sqlite3 \
            nivela-app:test

      - name: Aguardar a aplicação responder
        run: |
          echo "Aguardando container responder..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Aplicação no ar!"
              exit 0
            fi
            sleep 2
          done
          echo "Erro: Aplicação não respondeu a tempo."
          docker logs nivela-web
          exit 1

      - name: Executar OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Resumo do scan na aba do workflow
        if: always()
        run: |
          echo "### Resultado do DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          if [ -f report_html.html ]; then
            echo "Relatório HTML gerado com sucesso. Baixe os artefatos para análise." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coletar logs da aplicação
        if: always()
        run: |
          docker logs nivela-web > container.log || true

      - name: Publicar relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-dast-zap
          path: |
            report_html.html
            report_json.json
            report_xml.xml
            report_md.md
            container.log

      - name: Quality gate do DAST
        run: |
          rc="${{ steps.zap.outputs.exit_code }}"
          case "$rc" in
            0) echo "DAST limpo." ;;
            2) echo "::warning::ZAP encontrou alertas de severidade WARN. Veja o relatório no artefato." ;;
            1) echo "::error::ZAP encontrou vulnerabilidade classificada como FAIL (.zap/rules.tsv)."; exit 1 ;;
            *) echo "::error::Falha na execução do ZAP (código $rc)."; exit 1 ;;
          esac

      - name: Stop containers
        if: always()
        run: |
          docker stop nivela-web || true
          docker rm nivela-web || true

  # ==========================================
  # PARTE 2: Privacidade de Dados e LGPD com Bearer CLI
  # ==========================================
  privacy-bearer:
    name: Privacidade & LGPD - Bearer CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Bearer CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/bearer/bearer/main/ingress/install.sh | sh -s -- -b /usr/local/bin

      - name: Executar varredura de privacidade (Bearer)
        run: |
          bearer scan . \
            --format=rdjson,json \
            --output=bearer-report.rdjson,bearer-report.json \
            --severity=low,medium,high,critical || true

      - name: Gerar Resumo do Scan para a Aba Summary
        if: always()
        run: |
          echo "### 🔒 Relatório de Privacidade e Dados Sensíveis (Bearer CLI / LGPD)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bearer-report.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            head -n 40 bearer-report.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Nenhum relatório foi gerado." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar Relatórios de Privacidade como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-privacidade-bearer
          path: |
            bearer-report.json
            bearer-report.rdjson