name: DevSecOps Avançado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # PARTE 1: DAST com OWASP ZAP
  # ==========================================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nivela_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gerar segredos efêmeros
        id: generate-secrets
        run: |
          SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')
          ENCRYPTION_KEY=$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          # Mascara as chaves nos logs (o GitHub passa a exibir *** no lugar do valor)
          echo "::add-mask::${SECRET_KEY}"
          echo "::add-mask::${ENCRYPTION_KEY}"
          echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV
          echo "FIELD_ENCRYPTION_KEY=${ENCRYPTION_KEY}" >> $GITHUB_ENV

      - name: Compilar a imagem Docker da aplicação
        run: |
          docker build -t nivela-app:test .

      - name: Subir a aplicação (modo produção, DEBUG=False)
        run: |
          docker run -d \
            --name nivela-web \
            --network host \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=False \
            -e AXES_ENABLED=False \
            -e SECRET_KEY="${{ env.SECRET_KEY }}" \
            -e FIELD_ENCRYPTION_KEY="${{ env.FIELD_ENCRYPTION_KEY }}" \
            -e DB_ENGINE=django.db.backends.postgresql \
            -e DB_NAME=nivela_db \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgrespassword \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5433 \
            nivela-app:test

      - name: Aguardar a aplicação responder
        run: |
          echo "Aguardando container responder..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Aplicação no ar!"
              exit 0
            fi
            sleep 2
          done
          echo "Erro: Aplicação não respondeu a tempo."
          docker logs nivela-web
          exit 1

      # Bloqueio do ZAP: a action nativa (fail_action) trata avisos e falhas juntos.
      # Por isso o bloqueio e feito no passo "Quality gate do DAST", que le o relatorio
      # JSON e falha (exit 1) somente para as regras marcadas como FAIL em .zap/rules.tsv.
      - name: Executar OWASP ZAP Full Scan
        id: zap
        uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd295053ed # v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false  # o bloqueio e feito no Quality gate do DAST (abaixo)

      - name: Resumo do scan DAST na aba do workflow
        if: always()
        run: |
          echo "### 🛡️ Resultado do DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          if [ -f report_html.html ]; then
            echo "Relatório HTML gerado com sucesso. Baixe os artefatos para análise." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coletar logs da aplicação
        if: always()
        run: |
          docker logs nivela-web > container.log || true

      - name: Publicar relatórios DAST como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-dast-zap
          path: |
            report_html.html
            report_json.json
            report_xml.xml
            report_md.md
            container.log

      - name: Quality gate do DAST
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys

          # 1) Le do .zap/rules.tsv os IDs marcados como FAIL
          fail_ids = set()
          with open(".zap/rules.tsv", encoding="utf-8") as f:
              for linha in f:
                  linha = linha.strip()
                  if not linha or linha.startswith("#"):
                      continue
                  partes = linha.split("\t")
                  if len(partes) >= 2 and partes[1].strip().upper() == "FAIL":
                      fail_ids.add(partes[0].strip())

          # 2) Sem relatorio = o scan nao rodou, entao o gate falha
          if not os.path.exists("report_json.json"):
              print("::error::report_json.json nao encontrado: o ZAP nao gerou relatorio.")
              sys.exit(1)

          with open("report_json.json", encoding="utf-8-sig") as f:
              relatorio = json.load(f)

          # 3) Separa alertas bloqueantes (FAIL) dos demais (apenas aviso)
          bloqueantes, avisos = [], []
          for site in relatorio.get("site", []):
              for alerta in site.get("alerts", []):
                  item = f"{alerta.get('alert')} (ID {alerta.get('pluginid')})"
                  if str(alerta.get("pluginid")) in fail_ids:
                      bloqueantes.append(item)
                  else:
                      avisos.append(item)

          # 4) Resumo na aba Summary do workflow
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("### Quality gate do DAST\n\n")
              s.write(f"- Alertas bloqueantes (FAIL): **{len(bloqueantes)}**\n")
              s.write(f"- Alertas de aviso (WARN/INFO): **{len(avisos)}**\n")
              for b in bloqueantes:
                  s.write(f"  - BLOQUEANTE: {b}\n")

          if avisos:
              print(f"::warning::ZAP encontrou {len(avisos)} alerta(s) de aviso. Veja o relatorio no artefato.")
          if bloqueantes:
              for b in bloqueantes:
                  print(f"::error::Vulnerabilidade bloqueante: {b}")
              sys.exit(1)
          print("Quality gate aprovado: nenhum alerta FAIL.")
          PY

      - name: Stop containers
        if: always()
        run: |
          docker stop nivela-web || true
          docker rm nivela-web || true

  # ==========================================
  # PARTE 2: Privacidade de Dados e LGPD com Bearer CLI
  # ==========================================
  privacy-bearer:
    name: Privacidade & LGPD - Bearer CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Bearer CLI
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          bearer version

      - name: Varredura de seguranca e vazamento de dados no codigo
        run: |
          # Quality gate: falha o build se o código tiver vulnerabilidade crítica
          bearer scan . --report security --format json --output bearer-report.json --quiet --fail-on-severity critical

      - name: Varredura de privacidade (mapeamento de dados pessoais)
        if: always()
        run: |
          # Evidência LGPD: não bloqueia o build (o gate está no passo de segurança acima)
          bearer scan . --report privacy --format=json --output=bearer-privacy.json --quiet || true

      - name: Verificar se os relatorios foram gerados
        if: always()
        run: |
          for arq in bearer-report.json bearer-privacy.json; do
            if [ ! -s "$arq" ]; then
              echo "::error::$arq nao foi gerado: a varredura nao rodou."
              exit 1
            fi
            echo "$arq gerado: $(wc -c < "$arq") bytes."
          done

      - name: Resumo de privacidade e LGPD na aba Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          def carregar(caminho):
              try:
                  with open(caminho, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return None

          seguranca = carregar("bearer-report.json")
          privacidade = carregar("bearer-privacy.json")

          saida = ["### Privacidade e LGPD (scanner Bearer)", ""]

          # 1) Achados no codigo-fonte (vazamento de dados pessoais, sanitizacao)
          saida.append("#### Achados no codigo-fonte")
          if seguranca is None:
              saida.append("Relatorio de seguranca nao encontrado.")
          else:
              ordem = ["critical", "high", "medium", "low", "warning"]
              saida += ["", "| Severidade | Quantidade |", "|---|---|"]
              for n in ordem:
                  saida.append(f"| {n} | {len(seguranca.get(n, []))} |")
              saida += ["", "| Severidade | Regra | Arquivo | CWE |", "|---|---|---|---|"]
              for n in ordem:
                  for a in seguranca.get(n, []):
                      cwe = ", ".join(a.get("cwe_ids") or [])
                      saida.append(
                          f"| {n} | {a.get('title')} (`{a.get('id')}`) "
                          f"| `{a.get('filename')}:{a.get('line_number')}` | {cwe} |"
                      )

          # 2) Dados pessoais detectados (mapeamento LGPD)
          saida += ["", "#### Dados pessoais detectados (mapeamento LGPD)"]
          if privacidade is None:
              saida.append("Relatorio de privacidade nao encontrado.")
          else:
              saida += ["", "| Titular | Tipo de dado | Deteccoes | Falhas de regra |", "|---|---|---|---|"]
              for s in privacidade.get("subjects", []):
                  falhas = sum(
                      s.get(k, 0)
                      for k in (
                          "critical_risk_failure_count", "high_risk_failure_count",
                          "medium_risk_failure_count", "low_risk_failure_count",
                      )
                  )
                  saida.append(
                      f"| {s.get('subject_name')} | {s.get('name')} "
                      f"| {s.get('detection_count')} | {falhas} |"
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(saida) + "\n")
          PY

      - name: Publicar relatorios de privacidade como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-privacidade-bearer
          path: |
            bearer-report.json
            bearer-privacy.json
  # ==========================================
  # PARTE 3: Supply Chain Security & SBOM (Trivy / Pip-Audit)
  # ==========================================
  supply-chain:
    name: Supply Chain Security & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Auditoria de Dependências Python (pip-audit)
        run: |
          python3 -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc || true

      - name: Varredura de vulnerabilidades do repositorio (Trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-report.txt'

      - name: Publicar Relatório Supply Chain como Artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-supply-chain
          path: trivy-report.txt

      - name: Gerar SBOM CycloneDX (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Validar conteudo do SBOM
        run: |
          python3 - <<'PY'
          import json, os, sys
          with open("sbom-cyclonedx.json", encoding="utf-8") as f:
              sbom = json.load(f)
          componentes = [c for c in sbom.get("components", []) if c.get("type") == "library"]
          print(f"Formato: {sbom.get('bomFormat')} {sbom.get('specVersion')}")
          print(f"Bibliotecas listadas no SBOM: {len(componentes)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("### SBOM (CycloneDX)\n\n")
              s.write(f"- Bibliotecas listadas: **{len(componentes)}**\n\n")
              s.write("| Componente | Versao |\n|---|---|\n")
              for c in sorted(componentes, key=lambda c: c.get("name", "").lower()):
                  s.write(f"| {c.get('name')} | {c.get('version')} |\n")
          if sbom.get("bomFormat") != "CycloneDX" or not componentes:
              print("::error::SBOM vazio ou invalido: nenhuma dependencia foi inventariada.")
              sys.exit(1)
          PY

      - name: Publicar SBOM como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json