name: DevSecOps Avançado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # PARTE 1: DAST com OWASP ZAP
  # ==========================================
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nivela_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Gerar segredos efêmeros
        id: generate-secrets
        run: |
          SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')
          ENCRYPTION_KEY=$(python3 -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV
          echo "FIELD_ENCRYPTION_KEY=${ENCRYPTION_KEY}" >> $GITHUB_ENV

      - name: Compilar a imagem Docker da aplicação
        run: |
          docker build -t nivela-app:test .

      - name: Subir a aplicação (modo produção, DEBUG=False)
        run: |
          docker run -d \
            --name nivela-web \
            --network host \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=False \
            -e AXES_ENABLED=False \
            -e SECRET_KEY="${{ env.SECRET_KEY }}" \
            -e FIELD_ENCRYPTION_KEY="${{ env.FIELD_ENCRYPTION_KEY }}" \
            -e DB_ENGINE=django.db.backends.postgresql \
            -e DB_NAME=nivela_db \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgrespassword \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5433 \
            nivela-app:test

      - name: Aguardar a aplicação responder
        run: |
          echo "Aguardando container responder..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Aplicação no ar!"
              exit 0
            fi
            sleep 2
          done
          echo "Erro: Aplicação não respondeu a tempo."
          docker logs nivela-web
          exit 1

      - name: Executar OWASP ZAP Full Scan
        id: zap
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Resumo do scan DAST na aba do workflow
        if: always()
        run: |
          echo "### 🛡️ Resultado do DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          if [ -f report_html.html ]; then
            echo "Relatório HTML gerado com sucesso. Baixe os artefatos para análise." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coletar logs da aplicação
        if: always()
        run: |
          docker logs nivela-web > container.log || true

      - name: Publicar relatórios DAST como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-dast-zap
          path: |
            report_html.html
            report_json.json
            report_xml.xml
            report_md.md
            container.log

      - name: Quality gate do DAST
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys

          # 1) Le do .zap/rules.tsv os IDs marcados como FAIL
          fail_ids = set()
          with open(".zap/rules.tsv", encoding="utf-8") as f:
              for linha in f:
                  linha = linha.strip()
                  if not linha or linha.startswith("#"):
                      continue
                  partes = linha.split("\t")
                  if len(partes) >= 2 and partes[1].strip().upper() == "FAIL":
                      fail_ids.add(partes[0].strip())

          # 2) Sem relatorio = o scan nao rodou, entao o gate falha
          if not os.path.exists("report_json.json"):
              print("::error::report_json.json nao encontrado: o ZAP nao gerou relatorio.")
              sys.exit(1)

          with open("report_json.json", encoding="utf-8-sig") as f:
              relatorio = json.load(f)

          # 3) Separa alertas bloqueantes (FAIL) dos demais (apenas aviso)
          bloqueantes, avisos = [], []
          for site in relatorio.get("site", []):
              for alerta in site.get("alerts", []):
                  item = f"{alerta.get('alert')} (ID {alerta.get('pluginid')})"
                  if str(alerta.get("pluginid")) in fail_ids:
                      bloqueantes.append(item)
                  else:
                      avisos.append(item)

          # 4) Resumo na aba Summary do workflow
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("### Quality gate do DAST\n\n")
              s.write(f"- Alertas bloqueantes (FAIL): **{len(bloqueantes)}**\n")
              s.write(f"- Alertas de aviso (WARN/INFO): **{len(avisos)}**\n")
              for b in bloqueantes:
                  s.write(f"  - BLOQUEANTE: {b}\n")

          if avisos:
              print(f"::warning::ZAP encontrou {len(avisos)} alerta(s) de aviso. Veja o relatorio no artefato.")
          if bloqueantes:
              for b in bloqueantes:
                  print(f"::error::Vulnerabilidade bloqueante: {b}")
              sys.exit(1)
          print("Quality gate aprovado: nenhum alerta FAIL.")
          PY

      - name: Stop containers
        if: always()
        run: |
          docker stop nivela-web || true
          docker rm nivela-web || true

  # ==========================================
  # PARTE 2: Privacidade de Dados e LGPD com Bearer CLI
  # ==========================================
  privacy-bearer:
    name: Privacidade & LGPD - Bearer CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Bearer CLI
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          bearer version

      - name: Executar varredura de privacidade (Bearer)
        run: |
          # Relatório de privacidade, serve para evidenciar e não bloqueia a build
          bearer scan . --report privacy --format json --output bearer-privacy.json --exit-code 0
          # Relatório de segurança: falha o build se o código tiver vulnerabilidade crítica
          bearer scan . --report security --format json --output bearer-report.json --fail-on-severity critical

      - name: Verificar se o relatorio do Bearer foi gerado
        run: |
          if [ ! -s bearer-report.json ]; then
            echo "::error::bearer-report.json nao foi gerado: a varredura do Bearer nao rodou."
            exit 1
          fi
          echo "Relatorio do Bearer gerado: $(wc -c < bearer-report.json) bytes."

      - name: Gerar Resumo de Privacidade na aba Summary
        if: always()
        run: |
          echo "### 🔒 Relatório de Privacidade e Dados Sensíveis (Bearer CLI / LGPD)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bearer-report.json ]; then
            echo "Scan concluído com sucesso. O arquivo json de evidência foi gerado nos artefatos." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar Relatórios de Privacidade como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-privacidade-bearer
          path: |
            bearer-report.json
            bearer-privacy.json
          
  # ==========================================
  # PARTE 3: Supply Chain Security & SBOM (Trivy / Pip-Audit)
  # ==========================================
  supply-chain:
    name: Supply Chain Security & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Auditoria de Dependências Python (pip-audit)
        run: |
          python3 -m pip install --upgrade pip pip-audit
          pip-audit --desc || true

      - name: Varredura de Imagem Docker e Geração de SBOM (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-report.txt'

      - name: Publicar Relatório Supply Chain como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-supply-chain
          path: trivy-report.txt

      - name: Gerar SBOM CycloneDX (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Publicar SBOM como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json