{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nivela{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    {% block extra_media %}{% endblock %}

    <style>
        /* Card que envolve o formulario do wizard (auth / token / backup) */
        .col-md-5.offset-md-3{
            background: #F7F8FA;
            border: 1px solid #E4E7EC;
            border-radius: 12px;
            padding: 28px;
            margin-top: 48px;
        }
        .col-md-5.offset-md-3 h1{
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .col-md-5.offset-md-3 > p{
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* A lib renderiza os campos como tabela (wizard.form.as_table) */
        table.mb-3{
            width: 100%;
            border-collapse: collapse;
        }
        table.mb-3 tr{
            display: block;
            margin-bottom: 16px;
        }
        table.mb-3 th{
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            padding-bottom: 6px;
        }
        table.mb-3 td{
            display: block;
        }
        table.mb-3 input[type="text"],
        table.mb-3 input[type="password"],
        table.mb-3 input[type="email"]{
            width: 100%;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid #E4E7EC;
            font-size: 14px;
        }
        table.mb-3 input:focus{
            outline: none;
            border-color: #1D63E8;
        }

        .btn-primary{
            background-color: #1D63E8;
            border-color: #1D63E8;
        }
        .btn-primary:hover{
            background-color: #164FBD;
            border-color: #164FBD;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="{% static 'css/images/Logo.jpeg' %}" alt="Logo Nivela" style="height: 38px; border-radius: 6px;">
                <span class="fw-bold text-white">Nivela</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/turmas/">Turmas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/chat/">Chat</a></li>
                    <li class="nav-item"><a class="nav-link" href="/gamificacao/">Gamificacao</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content_wrapper %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <footer class="bg-dark text-light text-center py-3 mt-5">
        <small>Projeto Integrador 2026 - Nivela</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
